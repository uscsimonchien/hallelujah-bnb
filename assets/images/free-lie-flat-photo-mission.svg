<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#dff3ff"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f3e"/><stop offset="1" stop-color="#174f2c"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".18"/></filter>
  <style>
    .tc{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
    .serif{font-family:"Noto Serif TC","PMingLiU",serif}
  </style>
</defs>
<rect width="1600" height="1600" fill="url(#sky)"/>
<path d="M0 520L260 280l150 140 220-190 190 180 230-210 210 190 160-120 180 210v280H0z" fill="url(#hill)" opacity=".95"/>
<path d="M0 610c280-150 490-70 720-140 250-76 450-10 880 150v260H0z" fill="#5f9f47"/>
