  <text x="215" y="160" text-anchor="middle" class="tc" font-size="32" font-weight="700" fill="#5d4638">找到藏在各個角落的</text>
  <text x="215" y="204" text-anchor="middle" class="tc" font-size="32" font-weight="700" fill="#5d4638">躺平拍照點</text>
