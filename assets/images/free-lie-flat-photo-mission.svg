  <text x="800" y="355" text-anchor="middle" class="tc" font-size="112" font-weight="900" fill="#2d2018">尋找<tspan fill="#e13b1b">10張</tspan><tspan fill="#2a8a37">躺平</tspan><tspan fill="#5b351b">合照</tspan></text>
