    <rect x="110" y="25" width="145" height="180" rx="10" fill="#fff" stroke="#777" stroke-width="7"/>
  </g>
  <circle cx="322" cy="420" r="78" fill="#e8b05c" stroke="#7d4c1d" stroke-width="12"/>
  <text x="322" y="410" text-anchor="middle" class="tc" font-size="42" font-weight="900" fill="#352014">10/10</text>
  <text x="322" y="460" text-anchor="middle" class="tc" font-size="36" font-weight="900" fill="#352014">完成</text>
  <text x="215" y="560" text-anchor="middle" class="tc" font-size="30" font-weight="800" fill="#2d7c3b">完成任務</text>
</g>
<path d="M540 950h35" stroke="#b94913" stroke-width="20" stroke-linecap="round"/><path d="M560 925l32 25-32 25" fill="none" stroke="#b94913" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1035 950h35" stroke="#b94913" stroke-width="20" stroke-linecap="round"/><path d="M1055 925l32 25-32 25" fill="none" stroke="#b94913" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="150" y="1320" width="1300" height="155" rx="45" fill="#eebb70" stroke="#7d4c1d" stroke-width="14" filter="url(#shadow)"/>
<text x="800" y="1415" text-anchor="middle" class="tc" font-size="48" font-weight="900" fill="#3e2616">走進山林・放慢腳步・一起尋找屬於你的躺平時光！</text>
</svg>