<g transform="translate(1080 640)">
  <rect width="430" height="610" rx="44" fill="#fffaf0" stroke="#e7d7b4" stroke-width="6"/>
  <circle cx="72" cy="76" r="52" fill="#4f8a28"/><text x="72" y="95" text-anchor="middle" class="tc" font-size="62" font-weight="900" fill="#fff">3</text>
  <text x="240" y="96" text-anchor="middle" class="tc" font-size="54" font-weight="900" fill="#3c281b">集滿10張</text>
  <text x="215" y="160" text-anchor="middle" class="tc" font-size="32" font-weight="700" fill="#5d4638">集滿10張躺平合照</text>
  <text x="215" y="204" text-anchor="middle" class="tc" font-size="32" font-weight="700" fill="#5d4638">完成認證！</text>
