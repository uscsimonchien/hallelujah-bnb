  <circle cx="302" cy="390" r="72" fill="#bfefff" stroke="#4a3526" stroke-width="18"/>
  <line x1="350" y1="442" x2="405" y2="510" stroke="#7d4c1d" stroke-width="28" stroke-linecap="round"/>
  <text x="215" y="560" text-anchor="middle" class="tc" font-size="30" font-weight="800" fill="#2d7c3b">找拍照點</text>
