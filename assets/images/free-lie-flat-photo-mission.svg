  <path d="M105 405l60-55 45 38 55-60 20 77z" fill="#4c9945"/>
  <rect x="250" y="388" width="135" height="95" rx="20" fill="#50372a"/>
  <circle cx="318" cy="438" r="31" fill="#2fa9e0" stroke="#131313" stroke-width="8"/>
