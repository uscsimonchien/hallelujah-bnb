<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>露營營位預訂｜哈雷露亞民宿</title><style>body{margin:0;background:#f4f6f1;color:#213c30;font-family:system-ui,"Noto Sans TC",sans-serif}header{background:#214b38;color:white;padding:24px;text-align:center}main{max-width:760px;margin:25px auto;padding:0 16px}.panel{background:white;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 4px 22px #173c2412}h1{margin:0;font-size:26px}h2{font-size:20px}label{display:block;margin:15px 0 6px;font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #bdc9be;border-radius:10px;padding:13px;font-size:16px}button{border:0;background:#276647;color:white;border-radius:12px;padding:15px;width:100%;font-size:17px;font-weight:700;cursor:pointer}.hint{color:#596b60;font-size:14px;line-height:1.8}.sites{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.sites label{margin:0;border:1px solid #b9cbbb;border-radius:10px;padding:12px;font-weight:500}.sites input{width:auto}a{color:#276647}#result{white-space:pre-wrap;line-height:1.7}</style></head><body><header><h1>🏕️ 哈雷露亞｜露營營位預訂</h1><p>山林露營地・營位選擇與預訂申請</p></header><main><section class="panel"><h2>選擇露營日期與營位</h2><p class="hint">目前為人工確認預訂版本，送出不代表訂位成功。營位是否有空位及價格，皆以營主回覆為準。</p><form id="f"><label>入住日期</label><input name="checkin" type="date" required><label>退營日期</label><input name="checkout" type="date" required><label>選擇營位（可複選）</label><div class="sites"><label><input type="checkbox" name="site" value="3F-1"> 3F-1（3×5m）</label><label><input type="checkbox" name="site" value="3F-2"> 3F-2（3×5m）</label><label><input type="checkbox" name="site" value="4F-A-1"> 4F-A-1（4×6m）</label><label><input type="checkbox" name="site" value="4F-A-2"> 4F-A-2（4×6m）</label><label><input type="checkbox" name="site" value="4F-B-1"> 4F-B-1（4×6m）</label><label><input type="checkbox" name="site" value="4F-B-2"> 4F-B-2（4×6m）</label><label><input type="checkbox" name="site" value="6F-B-1"> 6F-B-1（4×6m）</label><label><input type="checkbox" name="site" value="6F-B-2"> 6F-B-2（4×6m）</label></div><label>聯絡姓名</label><input name="name" required maxlength="60"><label>聯絡電話</label><input name="phone" type="tel" required maxlength="30"><label>入住人數</label><input name="guests" type="number" min="1" max="60" value="2" required><label>備註</label><textarea name="note" rows="3" placeholder="例如：車輛數、特殊需求"></textarea><p class="hint">個人資料僅用於本次預訂聯繫。請勿在備註填寫信用卡或其他敏感資料。</p><button type="submit">產生預訂資料並前往 LINE</button></form></section><section class="panel" id="confirmation" hidden><h2>預訂資料</h2><div id="result"></div><button id="copy" type="button">複製預訂資料</button><p class="hint">LINE 若沒有自動帶入文字，請複製後貼給營主。完成營主確認及付款通知後才算正式成立。</p><p><a href="https://lin.ee/XsIMYvU" target="_blank" rel="noopener">LINE 預約諮詢</a></p></section><p><a href="index.html">← 返回官方網站</a></p></main><script>const form=document.querySelector('#f');const today=new Date(Date.now()+8*3600000).toISOString().slice(0,10);form.elements.checkin.min=today;form.elements.checkout.min=today;form.elements.checkin.addEventListener('change',()=>{const d=new Date(form.elements.checkin.value+'T12:00:00');d.setDate(d.getDate()+1);form.elements.checkout.min=d.toISOString().slice(0,10)});let msg='';form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form),sites=d.getAll('site');if(!sites.length){alert('請至少選擇一個營位');return}if(d.get('checkout')<=d.get('checkin')){alert('退營日期必須晚於入住日期');return}msg=['【哈雷露亞露營預訂申請】','入住：'+d.get('checkin'),'退營：'+d.get('checkout'),'營位：'+sites.join('、'),'姓名：'+d.get('name'),'電話：'+d.get('phone'),'人數：'+d.get('guests'),'備註：'+(d.get('note')||'無'),'※ 此為預訂申請，待營主確認空位及付款後才成立。'].join('\n');document.querySelector('#result').textContent=msg;document.querySelector('#confirmation').hidden=false;document.querySelector('#confirmation').scrollIntoView({behavior:'smooth'});window.open('https://lin.ee/XsIMYvU','_blank','noopener')});document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(msg).then(()=>alert('已複製，請貼到 LINE 傳送給營主')).catch(()=>alert('請長按上方內容複製'));</script></body></html>
