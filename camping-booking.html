<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>露營線上預訂｜哈雷露亞民宿</title><style>body{margin:0;background:#f4f6f1;color:#214332;font:16px system-ui,sans-serif}header{background:#214b38;color:white;text-align:center;padding:25px}main{max-width:850px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 3px 15px #1232}label{display:block;margin:14px 0 5px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c5bb;border-radius:9px;font:inherit}.dates{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.site{border:1px solid #c6d2c8;border-radius:12px;padding:12px;cursor:pointer}.site input{width:auto}.site:has(input:checked){background:#e1f3e5;border-color:#28754c}.site:has(input:disabled){opacity:.45;cursor:not-allowed}.muted{color:#627468;font-size:14px;line-height:1.7}.price{font-size:21px;font-weight:800;margin:15px 0}button{width:100%;border:0;border-radius:12px;padding:14px;background:#276647;color:white;font:700 17px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#result{white-space:pre-line}a{color:#276647}@media(max-width:500px){.dates{grid-template-columns:1fr}} .calendar-nav{display:flex;gap:8px}.calendar-nav button{width:42px;padding:8px}.calendar-grid .cal-day{width:auto;min-height:78px;padding:5px}.calendar-grid .cal-day .cal-date{display:block}.calendar-grid .cal-day .cal-stock{display:block;font-size:11px}.calendar-grid .cal-day .cal-rate{display:block;font-size:11px}.calendar-grid .cal-day.selected{background:#276647;color:#fff}.calendar-grid .cal-day.in-range{background:#d9e9db}.calendar-grid .cal-day.full{opacity:.45}.calendar-grid .cal-day.other{opacity:.4}@media(max-width:520px){.calendar-grid .cal-day{min-height:65px;font-size:12px}.calendar-grid .cal-day .cal-stock{font-size:9px}} </style><link href="assets/style.css" rel="stylesheet"><link href="assets/booking.css" rel="stylesheet"></head><body><header><h1>🏕️ 哈雷露亞露營線上預訂</h1><p>8 個營位｜平日假日每帳每晚 NT$1,000</p></header><main><section class="card"><div class="calendar-head"><div><div class="kicker">AVAILABILITY CALENDAR</div><h2 id="monthTitle">露營空位月曆</h2></div><div class="calendar-nav"><button type="button" id="prevMonth" aria-label="上個月">‹</button><button type="button" id="nextMonth" aria-label="下個月">›</button></div></div><div class="calendar-weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="calendar-grid" id="campCalendar"></div><div class="calendar-legend"><span>選擇入住、退營日期</span><span>每日顯示剩餘帳位</span></div><h2>選日期、查看空位</h2><div class="dates"><div><label for="checkin">入住日期</label><input id="checkin" type="date"></div><div><label for="checkout">退營日期</label><input id="checkout" type="date"></div></div><p id="availability" class="muted">選擇入住及退營日期，即可查詢即時空位。</p><div class="sites" id="sites"></div></section><section class="card"><h2>預訂資料</h2><form id="form"><label>聯絡姓名</label><input name="name" maxlength="80" required><label>聯絡電話</label><input name="phone" type="tel" required><label>入住人數</label><input name="guests" type="number" min="1" max="60" value="2" required><label>備註</label><textarea name="note" rows="3" maxlength="1000"></textarea><div id="price" class="price">請先選擇營位</div><p class="muted">送出後系統暫留營位兩小時，請透過官方 LINE 取得匯款資訊。收到訂金並經營主確認後，訂位才正式成立。尾款於入住時支付。</p><button id="submit" disabled>送出露營預訂申請</button></form></section><section class="card" id="confirmation" hidden><h2>預訂申請已建立</h2><div id="result"></div><p><a href="https://lin.ee/XsIMYvU" target="_blank" rel="noopener">LINE 預約諮詢｜聯繫營主確認訂金</a></p></section><p><a href="index.html">← 回到哈雷露亞民宿官方網站</a></p></main><script>
const api='https://hkrttulwietizshbfigq.supabase.co/functions/v1/camping-api',ci=document.querySelector('#checkin'),co=document.querySelector('#checkout'),siteBox=document.querySelector('#sites'),statusBox=document.querySelector('#availability'),price=document.querySelector('#price'),form=document.querySelector('#form'),submit=document.querySelector('#submit');
const today=new Date(Date.now()+8*3600000).toISOString().slice(0,10);ci.min=today;co.min=today;
let inventory=[],requestId=0;
function selected(){return [...siteBox.querySelectorAll('input:checked')].map(x=>x.value)}
function update(){const n=Math.round((Date.parse(co.value+'T00:00:00Z')-Date.parse(ci.value+'T00:00:00Z'))/86400000),ids=selected(),sum=inventory.filter(x=>ids.includes(x.id)).reduce((s,x)=>s+x.nightly_price,0)*n;price.textContent=n>0&&ids.length?'總額 NT$'+sum.toLocaleString()+'｜訂金 NT$'+Math.round(sum*.3).toLocaleString()+'｜現場尾款 NT$'+(sum-Math.round(sum*.3)).toLocaleString():'請先選擇營位';submit.disabled=!(n>0&&ids.length)}
async function load(){const id=++requestId;siteBox.replaceChildren();inventory=[];update();if(!ci.value||!co.value||co.value<=ci.value){statusBox.textContent='請選擇有效入住與退營日期';return}statusBox.textContent='正在讀取空位…';try{const r=await fetch(api+'?action=availability&'+new URLSearchParams({checkin:ci.value,checkout:co.value}));if(!r.ok)throw Error('空位查詢暫時無法使用');const data=await r.json();if(id!==requestId)return;inventory=(data.sites||[]).filter(s=>s.active);for(const s of inventory){const label=document.createElement('label');label.className='site';const input=document.createElement('input');input.type='checkbox';input.value=s.id;input.disabled=!s.available;input.addEventListener('change',update);label.append(input,document.createTextNode(' '+s.id+'｜'+s.width_m+'×'+s.depth_m+'m｜'+(s.available?'可預訂':'已滿／未開放')));siteBox.append(label)}statusBox.textContent='可預訂 '+inventory.filter(x=>x.available).length+'／'+inventory.length+' 帳';}catch(e){statusBox.textContent=e.message+'，請稍後重試或聯絡官方 LINE。';}}
ci.onchange=()=>{const d=new Date(ci.value+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);co.min=d.toISOString().slice(0,10);load()};co.onchange=load;
form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;const b=Object.fromEntries(new FormData(form));b.checkin=ci.value;b.checkout=co.value;b.sites=selected();try{const r=await fetch(api+'?action=bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),data=await r.json();if(!r.ok)throw Error(r.status===409?'部分營位已被預訂，請重新選擇':data.error||'預訂失敗');const x=data.booking;document.querySelector('#result').textContent='訂單編號：'+x.code+'\n營位：'+x.sites.join('、')+'\n總額：NT$'+x.total+'\n應付訂金：NT$'+x.deposit_due+'\n入住尾款：NT$'+x.balance+'\n請在兩小時內聯絡營主取得匯款資訊。';document.querySelector('#confirmation').hidden=false;document.querySelector('#confirmation').scrollIntoView({behavior:'smooth'});await load();}catch(e){alert(e.message);await load()}finally{update()}};

const cal=document.querySelector('#campCalendar'),monthTitle=document.querySelector('#monthTitle'),prev=document.querySelector('#prevMonth'),next=document.querySelector('#nextMonth');
let shown=new Date(),calendarAvailability=new Map(),calendarLoading=false,calendarRequest=0;shown.setDate(1);
const localIso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const toDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
function monthCells(){const start=new Date(shown.getFullYear(),shown.getMonth(),1,12);start.setDate(1-start.getDay());return Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d})}
async function fetchCalendar(){const id=++calendarRequest;calendarLoading=true;renderCalendar();const cells=monthCells();const start=localIso(cells[0]);const endDate=new Date(cells[41]);endDate.setDate(endDate.getDate()+1);const end=localIso(endDate);try{const r=await fetch(api+'?action=calendar&'+new URLSearchParams({from:start,to:end}));if(!r.ok)throw Error('calendar');const j=await r.json();if(id!==calendarRequest)return;calendarAvailability=new Map((j.dates||[]).map(x=>[x.date,x.available]));}catch{if(id===calendarRequest)calendarAvailability.clear()}finally{if(id===calendarRequest){calendarLoading=false;renderCalendar()}}}
function renderCalendar(){monthTitle.textContent=shown.getFullYear()+' 年 '+(shown.getMonth()+1)+' 月'+(calendarLoading?' · 更新中':'');cal.replaceChildren();const cells=monthCells();for(const d of cells){const day=localIso(d),b=document.createElement('button');b.type='button';b.className='cal-day';if(d.getMonth()!==shown.getMonth())b.classList.add('other');if(day===ci.value||day===co.value)b.classList.add('selected');else if(ci.value&&co.value&&day>ci.value&&day<co.value)b.classList.add('in-range');const remaining=calendarAvailability.get(day);if(remaining===0)b.classList.add('full');b.disabled=day<today||remaining===0||remaining===undefined;const n=document.createElement('span');n.className='cal-date';n.textContent=d.getDate();const stock=document.createElement('span');stock.className='cal-stock';stock.textContent=calendarLoading?'更新中':remaining===undefined?'查詢中':remaining>0?'可訂 '+remaining+' 帳':'已滿';const rate=document.createElement('span');rate.className='cal-rate';rate.textContent='NT$1,000';b.append(n,stock,rate);b.onclick=()=>{if(!ci.value||co.value||day<=ci.value){ci.value=day;co.value='';}else{co.value=day;}load();renderCalendar()};cal.append(b)}}
prev.onclick=()=>{shown.setMonth(shown.getMonth()-1);fetchCalendar()};next.onclick=()=>{shown.setMonth(shown.getMonth()+1);fetchCalendar()};ci.addEventListener('change',renderCalendar);co.addEventListener('change',renderCalendar);fetchCalendar();
</script></body></html>
