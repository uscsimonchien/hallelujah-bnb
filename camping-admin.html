<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>露營訂單管理｜哈雷露亞</title><style>body{margin:0;background:#f4f6f1;color:#244633;font:15px system-ui,sans-serif}header{background:#214b38;color:white;padding:22px}main{max-width:1200px;margin:25px auto;padding:0 14px}.card{background:white;border-radius:15px;padding:20px;margin-bottom:16px}input,select,button{padding:10px;border-radius:8px;border:1px solid #b9cabc;font:inherit}button{background:#276647;color:white;cursor:pointer;border:0}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{border-bottom:1px solid #ddd;padding:10px;text-align:left}th{background:#edf3ed}.scroll{overflow:auto}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{font-size:13px;padding:7px}#message{color:#934323}small{color:#66786a}</style></head><body><header><h1>🏕️ 哈雷露亞｜露營訂單管理</h1><a href="admin.html" style="color:white">返回民宿訂房後台</a></header><main><section class="card"><h2>管理員登入</h2><input id="key" type="password" placeholder="管理金鑰" autocomplete="off"><button id="login">載入訂單</button><p id="message">管理金鑰僅保存在本頁記憶體，關閉頁面即清除。</p></section><section class="card"><h2>露營訂單 <button id="refresh">重新整理</button></h2><div class="scroll"><table><thead><tr><th>編號</th><th>客人／電話</th><th>日期</th><th>營位</th><th>狀態</th><th>總額</th><th>已收訂金</th><th>已收尾款</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const API='https://hkrttulwietizshbfigq.supabase.co/functions/v1/camping-api';let key='';
const rows=document.querySelector('#rows'),msg=document.querySelector('#message');
async function request(action,method='GET',data){const r=await fetch(API+'?action='+action,{method,headers:{'Content-Type':'application/json','x-admin-key':key},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'操作失敗');return j}
const td=(tr,value)=>{const cell=tr.insertCell();cell.textContent=String(value??'—');return cell};
function action(parent,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(!confirm('確認'+label+'？'))return;try{await fn();await load()}catch(e){alert(e.message)}};parent.append(b)}
async function load(){if(!key){msg.textContent='請輸入管理金鑰';return}try{const data=await request('admin-bookings');rows.replaceChildren();for(const b of data.bookings){const tr=rows.insertRow();td(tr,b.code);td(tr,b.guest_name+' / '+b.guest_phone);td(tr,b.checkin+' ～ '+b.checkout);td(tr,(b.sites||[]).join('、'));td(tr,b.status);td(tr,'NT$'+b.total);td(tr,'NT$'+b.deposit_paid+' / '+b.deposit_due);td(tr,'NT$'+b.balance_paid+' / '+(b.total-b.deposit_due));const cell=tr.insertCell(),buttons=document.createElement('div');buttons.className='actions';cell.append(buttons);if(b.status!=='confirmed')action(buttons,'確認訂單',()=>request('admin-status','PATCH',{id:b.id,status:'confirmed'}));if(b.status!=='cancelled')action(buttons,'取消訂單',()=>request('admin-status','PATCH',{id:b.id,status:'cancelled'}));if(b.deposit_paid<b.deposit_due)action(buttons,'登記訂金',()=>request('admin-payment','POST',{id:b.id,kind:'deposit',amount:b.deposit_due-b.deposit_paid}));const due=b.total-b.deposit_paid-b.balance_paid;if(due>0)action(buttons,'登記剩餘款',()=>request('admin-payment','POST',{id:b.id,kind:'balance',amount:due}));}msg.textContent='已載入 '+data.bookings.length+' 筆訂單';}catch(e){msg.textContent='載入失敗：'+e.message}}
document.querySelector('#login').onclick=()=>{key=document.querySelector('#key').value;document.querySelector('#key').value='';load()};document.querySelector('#refresh').onclick=load;
</script></body></html>
