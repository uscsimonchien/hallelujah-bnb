<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>露營訂單管理後台｜哈雷露亞民宿</title><link rel="stylesheet" href="assets/style.css"><style>
body{background:#f4f1e9}.admin-wrap{width:min(1180px,94%);margin:40px auto 80px}.admin-login,.admin-card{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:24px}.admin-login{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.admin-login label{min-width:240px}.admin-login input{margin-top:6px}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.admin-stat{background:#fff;padding:20px;border-radius:18px;border:1px solid var(--line)}.admin-stat small{display:block;color:var(--muted)}.admin-stat strong{font-size:28px;color:var(--forest)}.admin-table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:1000px}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid #ecefe9;text-align:left;vertical-align:top}.admin-table th{background:#f4f1e9;position:sticky;top:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;border-radius:999px;padding:7px 10px;cursor:pointer;background:#dcecdf;color:#164d2e}.actions button:nth-child(2){background:#f5dddd;color:#7b2424}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#e6eee7;color:#235139;font-size:12px;font-weight:800}td small{display:block;margin-top:5px;color:#66786a}.admin-msg{margin:12px 0;color:#8a3b2f}.admin-card h3{margin:0}.admin-table-wrap{margin-top:12px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-title button{border:0;border-radius:999px;padding:9px 15px;cursor:pointer}.manual-card{margin:22px 0}.manual-card h3{margin:0 0 6px}.manual-card p{margin:0 0 18px;color:var(--muted)}.manual-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.manual-grid label{font-size:13px;font-weight:800;color:#425149}.manual-grid input,.manual-grid select,.manual-grid textarea{width:100%;margin-top:6px}.manual-grid .wide{grid-column:span 2}.manual-grid .full{grid-column:1/-1}.manual-grid textarea{min-height:86px}.manual-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.manual-hint{font-size:12px;color:#6d766f}.note-text{white-space:pre-wrap;min-width:140px;max-width:260px;overflow-wrap:anywhere}@media(max-width:900px){.manual-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.admin-stats{grid-template-columns:1fr 1fr}.manual-grid{grid-template-columns:1fr}.manual-grid .wide,.manual-grid .full{grid-column:auto}.admin-wrap{margin:20px auto 50px}.admin-login,.admin-card{padding:16px}.admin-login label{min-width:0;width:100%}}
</style></head><body><header class="site-header"><div class="wrap"><div class="nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logo.webp" alt="哈雷露亞民宿 Logo"><span class="brand-title">哈雷露亞民宿</span></a><a class="nav-cta" href="admin.html">民宿訂房後台</a></div></div></header><div class="header-space"></div>
<main class="admin-wrap"><div class="admin-head"><div class="kicker">CAMPING ADMIN</div><h1 class="title">露營訂單管理後台</h1><p class="lead">露營訂單、確認狀態、收款與備註管理。</p></div>
<div class="admin-login"><label>管理金鑰<input id="key" type="password" autocomplete="current-password" placeholder="輸入管理金鑰"></label><button id="login" class="btn dark">登入後台</button></div><div id="message" class="admin-msg">管理金鑰僅保存在本頁記憶體，關閉頁面即清除。</div>
<section class="admin-card manual-card"><h3>新增人工露營訂單／封位</h3><p>LINE、電話或 Facebook 收到的預訂可直接建立；成功後立即占用營位。備註會保留在訂單中。</p><form id="manualForm"><div class="manual-grid">
<label>來源<select id="manualSource"><option>LINE</option><option>電話</option><option>Facebook</option><option>其他</option><option>封位</option></select></label>
<label>入住日期<input id="manualCheckin" type="date" required></label><label>退營日期<input id="manualCheckout" type="date" required></label>
<label>營位數<select id="manualCount"><option value="1">1 帳</option><option value="2">2 帳</option><option value="3">3 帳</option><option value="4">4 帳</option><option value="5">5 帳</option><option value="6">6 帳</option><option value="7">7 帳</option><option value="8">8 帳</option><option value="9">9 帳</option><option value="10">10 帳</option></select></label>
<label class="wide">姓名<input id="manualName" maxlength="80" required placeholder="客人姓名；封位可填管理員"></label>
<label>電話<input id="manualPhone" type="tel" required placeholder="請填聯絡電話"></label>
<label>入住人數<input id="manualGuests" type="number" min="1" max="60" value="1" required></label>
<div class="full"><label>選擇營位（依營位數勾選）</label><div id="manualSites" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px;margin-top:9px"></div><small id="siteHint">請先選擇入住與退營日期，系統會檢查可訂營位。</small></div>
<label class="full">備註<textarea id="manualNote" maxlength="950" placeholder="例如：LINE 已確認、特殊需求、封位原因"></textarea></label>
<div class="full manual-actions"><button class="btn dark" id="manualSubmit" type="submit">新增並立即占位</button><span class="manual-hint" id="manualResult">建立後為「已確認」，取消後營位會釋出。</span></div>
</div></form></section><div class="admin-stats"><div class="admin-stat"><small>待確認</small><strong id="statPending">—</strong></div><div class="admin-stat"><small>已確認</small><strong id="statConfirmed">—</strong></div><div class="admin-stat"><small>已收款</small><strong id="statPaid">—</strong></div><div class="admin-stat"><small>總訂單</small><strong id="statTotal">—</strong></div></div>
<section class="admin-card"><div class="section-title"><h3>訂單列表</h3><button id="refresh" class="btn">重新整理</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>狀態</th><th>編號／建立時間</th><th>客人</th><th>住宿日期</th><th>營位／人數</th><th>金額</th><th>備註</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const API='https://hkrttulwietizshbfigq.supabase.co/functions/v1/camping-api';let key='';
const rows=document.querySelector('#rows'),msg=document.querySelector('#message');
async function request(action,method='GET',data){const r=await fetch(API+'?action='+action,{method,headers:{'Content-Type':'application/json','x-admin-key':key},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'操作失敗');return j}
const td=(tr,value)=>{const cell=tr.insertCell();cell.textContent=String(value??'—');return cell};
function action(parent,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(!confirm('確認'+label+'？'))return;try{await fn();await load()}catch(e){alert(e.message)}};parent.append(b)}
const fmt=n=>'NT$'+Number(n||0).toLocaleString('zh-TW');
const statusName=s=>({pending:'待確認',confirmed:'已確認',paid:'已收款',cancelled:'已取消'})[s]||s;
async function load(){if(!key){msg.textContent='請輸入管理金鑰';return}try{const data=await request('admin-bookings');const bookings=data.bookings||[];rows.replaceChildren();for(const [id,status] of [['statPending','pending'],['statConfirmed','confirmed'],['statPaid','paid']])document.getElementById(id).textContent=bookings.filter(b=>b.status===status).length;document.getElementById('statTotal').textContent=bookings.length;for(const b of bookings){const tr=rows.insertRow();const badge=td(tr,statusName(b.status));badge.firstChild&&badge.replaceChildren();const span=document.createElement('span');span.className='status';span.textContent=statusName(b.status);badge.append(span);const code=td(tr,b.code);if(b.created_at){const s=document.createElement('small');s.textContent=new Date(b.created_at).toLocaleString('zh-TW',{hour12:false});code.append(s)}const guest=td(tr,b.guest_name||'—');const phone=document.createElement('small');phone.textContent=b.guest_phone||'—';guest.append(phone);td(tr,(b.checkin||'—')+' → '+(b.checkout||'—'));td(tr,(b.sites||[]).join('、')+(b.guests?' / '+b.guests+' 人':''));const amount=td(tr,fmt(b.total));const payment=document.createElement('small');payment.textContent='訂金 '+fmt(b.deposit_paid)+' / '+fmt(b.deposit_due)+'；尾款已收 '+fmt(b.balance_paid);amount.append(payment);const noteCell=td(tr,b.note||b.notes||'—');noteCell.className='note-text';const cell=tr.insertCell(),buttons=document.createElement('div');buttons.className='actions';cell.append(buttons);if(b.status!=='confirmed'&&b.status!=='cancelled')action(buttons,'確認',()=>request('admin-status','PATCH',{id:b.id,status:'confirmed'}));if(b.status!=='cancelled')action(buttons,'取消',()=>request('admin-status','PATCH',{id:b.id,status:'cancelled'}));if(b.status!=='cancelled'&&Number(b.deposit_paid||0)<Number(b.deposit_due||0))action(buttons,'登記訂金',()=>request('admin-payment','POST',{id:b.id,kind:'deposit',amount:b.deposit_due-b.deposit_paid}));const due=b.total-b.deposit_paid-b.balance_paid;if(b.status!=='cancelled'&&due>0)action(buttons,'登記尾款',()=>request('admin-payment','POST',{id:b.id,kind:'balance',amount:due}));}msg.textContent='已載入 '+bookings.length+' 筆訂單';}catch(e){msg.textContent='載入失敗：'+e.message}}
const siteIds=['3F-1','3F-2','4F-A-1','4F-A-2','4F-B-1','4F-B-2','6F-B-1','6F-B-2','6F-A-1','6F-A-2'];
async function refreshSites(){const a=document.querySelector('#manualCheckin').value,b=document.querySelector('#manualCheckout').value,wrap=document.querySelector('#manualSites'),hint=document.querySelector('#siteHint');wrap.replaceChildren();if(!a||!b||b<=a){hint.textContent='請先選擇正確的入住與退營日期';return}try{const res=await fetch(API+'?action=availability&checkin='+encodeURIComponent(a)+'&checkout='+encodeURIComponent(b));const data=await res.json();if(!res.ok)throw Error(data.error||'查詢失敗');for(const s of data.sites||[]){const label=document.createElement('label');label.style.cssText='display:flex;gap:6px;align-items:center;padding:9px;border:1px solid #dde6dc;border-radius:10px';const input=document.createElement('input');input.type='checkbox';input.name='manualSite';input.value=s.id;input.disabled=!s.available;label.append(input,document.createTextNode(s.id+(s.available?'':'（已占）')));wrap.append(label)}hint.textContent='請勾選可訂營位；已占用的營位無法選擇。'}catch(e){hint.textContent='營位查詢失敗：'+e.message}}
document.querySelector('#manualCheckin').addEventListener('change',refreshSites);document.querySelector('#manualCheckout').addEventListener('change',refreshSites);
document.querySelector('#manualForm').addEventListener('submit',async e=>{e.preventDefault();const selected=[...document.querySelectorAll('input[name="manualSite"]:checked')].map(x=>x.value);const count=Number(document.querySelector('#manualCount').value),result=document.querySelector('#manualResult');if(selected.length!==count){result.textContent='請選擇 '+count+' 個營位（目前 '+selected.length+' 個）';return}if(!key){result.textContent='請先輸入管理金鑰並登入';return}const body={source:document.querySelector('#manualSource').value,checkin:document.querySelector('#manualCheckin').value,checkout:document.querySelector('#manualCheckout').value,name:document.querySelector('#manualName').value.trim(),phone:document.querySelector('#manualPhone').value.trim(),guests:Number(document.querySelector('#manualGuests').value),sites:selected,note:document.querySelector('#manualNote').value};if(!confirm('確認建立人工露營訂單並立即占用 '+selected.join('、')+'？'))return;const btn=document.querySelector('#manualSubmit');btn.disabled=true;result.textContent='建立中…';try{const created=await request('admin-manual-create','POST',body);result.textContent='建立成功：'+created.booking.code;document.querySelector('#manualForm').reset();await load();await refreshSites()}catch(err){result.textContent='建立失敗：'+err.message+'（請檢查日期、營位與資料）';await refreshSites()}finally{btn.disabled=false}});
document.querySelector('#login').onclick=()=>{key=document.querySelector('#key').value;document.querySelector('#key').value='';load()};document.querySelector('#refresh').onclick=load;
</script></body></html>
