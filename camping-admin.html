<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>露營訂單管理｜哈雷露亞</title><link rel="stylesheet" href="assets/style.css"><style>
body{margin:0;background:#f4f1e9;color:#244633;font:15px system-ui,sans-serif}header{background:#202b26;color:#fff;padding:18px max(20px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:19px;margin:0}header a{color:#23382b;background:#fff;border-radius:999px;padding:10px 16px;text-decoration:none}main{max-width:1180px;margin:28px auto 70px;padding:0 16px}.card{background:#fff;border-radius:22px;padding:24px;margin-bottom:20px;box-shadow:0 5px 24px #253a2910}h2{font-size:21px;margin:0 0 18px}input,select,button{padding:11px;border-radius:10px;border:1px solid #d7dfd6;font:inherit}button{background:#214b38;color:white;cursor:pointer;border:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.stat{background:#fff;border-radius:18px;padding:20px;border:1px solid #e6e9e2}.stat small{display:block;color:#69796e}.stat strong{display:block;font-size:29px;margin-top:8px;color:#194934}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{border-bottom:1px solid #ecefe9;padding:12px;text-align:left;vertical-align:top}th{background:#f4f1e9}td small{display:block;margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 10px;border-radius:999px}.actions button:nth-child(1){background:#dcecdf;color:#164d2e}.actions button:nth-child(2){background:#f5dddd;color:#7b2424}#message{color:#755a37}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-title h2{margin:0}.section-title button{background:#eee;color:#234633}.status{border-radius:999px;background:#e6eee7;color:#235139;padding:5px 9px;display:inline-block;font-size:12px}@media(max-width:700px){header{padding:14px}main{padding:0 12px;margin-top:16px}.card{padding:16px;border-radius:17px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:14px}.stat strong{font-size:25px}table{min-width:900px}h2{font-size:18px}}
</style></head><body><header><h1>🏕️ 哈雷露亞｜露營訂單管理</h1><a href="admin.html" style="color:white">返回民宿訂房後台</a></header><main><section class="card"><h2>管理員登入</h2><input id="key" type="password" placeholder="管理金鑰" autocomplete="off"><button id="login">載入訂單</button><p id="message">管理金鑰僅保存在本頁記憶體，關閉頁面即清除。</p></section><section class="stats" aria-label="訂單統計"><div class="stat"><small>待確認</small><strong id="statPending">—</strong></div><div class="stat"><small>已確認</small><strong id="statConfirmed">—</strong></div><div class="stat"><small>已收款</small><strong id="statPaid">—</strong></div><div class="stat"><small>總訂單</small><strong id="statTotal">—</strong></div></section><section class="card"><div class="section-title"><h2>訂單列表</h2><button id="refresh">重新整理</button></div><div class="scroll"><table><thead><tr><th>狀態</th><th>編號／建立時間</th><th>客人</th><th>住宿日期</th><th>營位／人數</th><th>金額</th><th>備註</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const API='https://hkrttulwietizshbfigq.supabase.co/functions/v1/camping-api';let key='';
const rows=document.querySelector('#rows'),msg=document.querySelector('#message');
async function request(action,method='GET',data){const r=await fetch(API+'?action='+action,{method,headers:{'Content-Type':'application/json','x-admin-key':key},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'操作失敗');return j}
const td=(tr,value)=>{const cell=tr.insertCell();cell.textContent=String(value??'—');return cell};
function action(parent,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(!confirm('確認'+label+'？'))return;try{await fn();await load()}catch(e){alert(e.message)}};parent.append(b)}
const fmt=n=>'NT$'+Number(n||0).toLocaleString('zh-TW');
const statusName=s=>({pending:'待確認',confirmed:'已確認',paid:'已收款',cancelled:'已取消'})[s]||s;
async function load(){if(!key){msg.textContent='請輸入管理金鑰';return}try{const data=await request('admin-bookings');const bookings=data.bookings||[];rows.replaceChildren();for(const [id,status] of [['statPending','pending'],['statConfirmed','confirmed'],['statPaid','paid']])document.getElementById(id).textContent=bookings.filter(b=>b.status===status).length;document.getElementById('statTotal').textContent=bookings.length;for(const b of bookings){const tr=rows.insertRow();const badge=td(tr,statusName(b.status));badge.firstChild&&badge.replaceChildren();const span=document.createElement('span');span.className='status';span.textContent=statusName(b.status);badge.append(span);const code=td(tr,b.code);if(b.created_at){const s=document.createElement('small');s.textContent=new Date(b.created_at).toLocaleString('zh-TW',{hour12:false});code.append(s)}const guest=td(tr,b.guest_name||'—');const phone=document.createElement('small');phone.textContent=b.guest_phone||'—';guest.append(phone);td(tr,(b.checkin||'—')+' → '+(b.checkout||'—'));td(tr,(b.sites||[]).join('、')+(b.guests?' / '+b.guests+' 人':''));const amount=td(tr,fmt(b.total));const payment=document.createElement('small');payment.textContent='訂金 '+fmt(b.deposit_paid)+' / '+fmt(b.deposit_due)+'；尾款已收 '+fmt(b.balance_paid);amount.append(payment);td(tr,b.notes||b.note||'—');const cell=tr.insertCell(),buttons=document.createElement('div');buttons.className='actions';cell.append(buttons);if(b.status!=='confirmed'&&b.status!=='cancelled')action(buttons,'確認',()=>request('admin-status','PATCH',{id:b.id,status:'confirmed'}));if(b.status!=='cancelled')action(buttons,'取消',()=>request('admin-status','PATCH',{id:b.id,status:'cancelled'}));if(b.status!=='cancelled'&&Number(b.deposit_paid||0)<Number(b.deposit_due||0))action(buttons,'登記訂金',()=>request('admin-payment','POST',{id:b.id,kind:'deposit',amount:b.deposit_due-b.deposit_paid}));const due=b.total-b.deposit_paid-b.balance_paid;if(b.status!=='cancelled'&&due>0)action(buttons,'登記尾款',()=>request('admin-payment','POST',{id:b.id,kind:'balance',amount:due}));}msg.textContent='已載入 '+bookings.length+' 筆訂單';}catch(e){msg.textContent='載入失敗：'+e.message}}
document.querySelector('#login').onclick=()=>{key=document.querySelector('#key').value;document.querySelector('#key').value='';load()};document.querySelector('#refresh').onclick=load;
</script></body></html>
